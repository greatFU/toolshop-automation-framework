name: Toolshop UI Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify environment
        run: |
          java -version
          mvn -version

      - name: Check Toolshop availability
        run: |
          echo "=== Frontend ==="
          curl -I https://practicesoftwaretesting.com/

          echo "=== Products API ==="
          curl -sS -o products-response.json -w "HTTP status: %{http_code}\n" https://api.practicesoftwaretesting.com/products

          echo "=== API response preview ==="
          head -c 1000 products-response.json
          echo
          
      - name: Run UI tests
        run: mvn clean test -Dbrowser=chrome -Dheadless=true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: |
            reports/
            screenshots/
            target/surefire-reports/
          if-no-files-found: warn